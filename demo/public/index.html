<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneSave - Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-check2-square"></i> OneSave</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link" id="userDisplay"></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()" id="logoutBtn" style="display:none;">
                            <i class="bi bi-box-arrow-right"></i> Déconnexion
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="authView" style="display:none;">
        <div class="auth-container">
            <div class="card auth-card shadow">
                <div class="card-body">
                    <h1 class="text-center mb-4 text-primary"><i class="bi bi-check2-square"></i> OneSave</h1>
                    <p class="text-center text-muted mb-4">Gestion collaborative de projets</p>
                    
                    <ul class="nav nav-tabs mb-4" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginTab">Connexion</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTab">Inscription</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div id="loginTab" class="tab-pane fade show active">
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="loginEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mot de passe</label>
                                    <input type="password" class="form-control" id="loginPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                            </form>
                            <div class="alert alert-info mt-3 text-center">
                                <small>
                                    <strong>Démo:</strong><br>
                                    Email: demo@example.com<br>
                                    Mot de passe: demo123
                                </small>
                            </div>
                        </div>

                        <div id="registerTab" class="tab-pane fade">
                            <form onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label">Nom complet</label>
                                    <input type="text" class="form-control" id="registerName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="registerEmail" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Mot de passe</label>
                                    <input type="password" class="form-control" id="registerPassword" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Créer un compte</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="appView" style="display:none;">
        <div class="container-fluid py-4">
            <div class="row">
                <div class="col-md-3">
                    <div class="card bg-light sticky-top">
                        <div class="card-body">
                            <h6 class="card-title mb-3"><i class="bi bi-list-check"></i> Navigation</h6>
                            <ul class="nav flex-column">
                                <li class="nav-item">
                                    <a class="nav-link active" href="#" onclick="showProjects()">Mes projets</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#" onclick="showCollaborations()">En collaboration</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#" onclick="showEvents()">Événements</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="#" onclick="showReports()">Rapports</a>
                                </li>
                                <li class="nav-item mt-3">
                                    <a class="nav-link" href="#" onclick="showProfile()"><i class="bi bi-person"></i> Profil</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div id="projectsView" style="display:none;">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2><i class="bi bi-folder-check"></i> Mes Projets</h2>
                            <button class="btn btn-primary" onclick="showNewProjectForm()">
                                <i class="bi bi-plus-circle"></i> Nouveau projet
                            </button>
                        </div>
                        
                        <div id="newProjectForm" style="display:none;" class="card mb-4">
                            <div class="card-body">
                                <h5 class="card-title">Créer un nouveau projet</h5>
                                <form onsubmit="handleCreateProject(event)">
                                    <div class="mb-3">
                                        <label class="form-label">Titre du projet</label>
                                        <input type="text" class="form-control" id="projectTitle" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-control" id="projectDesc" rows="3"></textarea>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Date de début</label>
                                            <input type="date" class="form-control" id="projectStart" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Date de fin</label>
                                            <input type="date" class="form-control" id="projectEnd">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Statut</label>
                                        <select class="form-control" id="projectStatus">
                                            <option value="planifié">Planifié</option>
                                            <option value="en_cours" selected>En cours</option>
                                            <option value="terminé">Terminé</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-success">Créer le projet</button>
                                    <button type="button" class="btn btn-secondary" onclick="hideNewProjectForm()">Annuler</button>
                                </form>
                            </div>
                        </div>

                        <div id="projectsList" class="row"></div>
                    </div>

                    <div id="collaborationsView" style="display:none;">
                        <h2><i class="bi bi-people"></i> Projets en collaboration</h2>
                        <div id="collaborationsList" class="row"></div>
                    </div>

                    <div id="eventsView" style="display:none;">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2><i class="bi bi-calendar-event"></i> Événements</h2>
                            <button class="btn btn-primary" onclick="showNewEventForm()">
                                <i class="bi bi-plus-circle"></i> Nouvel événement
                            </button>
                        </div>
                        <div id="eventsList" class="row"></div>
                    </div>

                    <div id="reportsView" style="display:none;">
                        <h2><i class="bi bi-file-text"></i> Rapports</h2>
                        <div id="reportsList" class="row"></div>
                    </div>

                    <div id="profileView" style="display:none;">
                        <div class="card">
                            <div class="card-body">
                                <h2><i class="bi bi-person-circle"></i> Mon Profil</h2>
                                <hr>
                                <div class="mb-3">
                                    <label class="form-label">Nom</label>
                                    <input type="text" class="form-control" id="profileName" disabled>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="profileEmail" disabled>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Rôle</label>
                                    <input type="text" class="form-control" id="profileRole" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
