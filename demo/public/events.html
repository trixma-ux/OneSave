<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSave - Événements</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h1 class="h4 mb-4 text-primary fw-bold">OneSave</h1>
    <nav class="nav flex-column">
      <a href="/dashboard.html" class="nav-link"> <i class="bi bi-house-door me-2"></i> Tableau de bord</a>
      <a href="/projects.html" class="nav-link"> <i class="bi bi-folder me-2"></i> Projets</a>
      <a href="/events.html" class="nav-link active"> <i class="bi bi-calendar-event me-2"></i> Événements</a>
      <a href="/reports.html" class="nav-link"> <i class="bi bi-file-text me-2"></i> Rapports</a>
      <hr>
      <a href="#" class="nav-link" onclick="auth.logout()"><i class="bi bi-box-arrow-right me-2"></i> Déconnexion</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Événements</h2>
        <div>
          <button class="btn btn-outline-secondary me-2" onclick="refreshPage()">Rafraîchir</button>
          <button class="btn btn-primary" id="newEventBtn">Nouvel événement</button>
        </div>
      </div>

      <div id="eventsGrid" class="row"></div>

      <!-- Modal Événement -->
      <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Nouvel événement</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Nom</label>
                <input id="eventName" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="eventDesc" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Date et heure</label>
                <input type="datetime-local" id="eventDate" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Projet associé</label>
                <select id="eventProject" class="form-control">
                  <option value="">-- Aucun projet --</option>
                </select>
              </div>
              <input type="hidden" id="eventModalSaveMode" value="create">
              <input type="hidden" id="eventModalId" value="">
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
              <button class="btn btn-primary" id="saveEventBtn">Enregistrer</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Global delete confirmation modal -->
  <div class="modal fade" id="globalDeleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmer la suppression</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Voulez-vous vraiment supprimer <strong class="delete-target-name"></strong> ?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadEvents() {
      try {
        const list = await events.getAll();
        document.getElementById('eventsGrid').innerHTML = list.map(e => events.renderEventCard(e)).join('');
      } catch (e) {
        showError('Impossible de récupérer les événements');
      }
    }

    async function loadProjectsForSelect() {
      try {
        const projects = await window.projects.getAll();
        const select = document.getElementById('eventProject');
        select.innerHTML = '<option value="">-- Aucun projet --</option>' +
          projects.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
      } catch (e) {
        showError('Impossible de charger la liste des projets');
      }
    }

    async function handleSaveEvent(modal) {
      try {
        const data = {
          name: document.getElementById('eventName').value,
          description: document.getElementById('eventDesc').value,
          date: document.getElementById('eventDate').value,
          project_id: document.getElementById('eventProject').value || null
        };

        const mode = document.getElementById('eventModalSaveMode').value;
        if (mode === 'edit') {
          const id = document.getElementById('eventModalId').value;
          await events.update(id, data);
          showSuccess('Événement mis à jour');
        } else {
          await events.create(data);
          showSuccess('Événement créé avec succès');
        }

        modal.hide();
        await loadEvents(); // Recharger la liste
      } catch (e) {
        showError('Erreur lors de la création de l\'événement');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      loadEvents();

      const modal = new bootstrap.Modal(document.getElementById('eventModal'));
      document.getElementById('newEventBtn').addEventListener('click', async () => {
        // Réinitialiser le formulaire et charger les projets
        document.getElementById('eventName').value = '';
        document.getElementById('eventDesc').value = '';
        document.getElementById('eventDate').value = new Date().toISOString().slice(0, 16);
        document.getElementById('eventModalSaveMode').value = 'create';
        document.getElementById('eventModalId').value = '';
        await loadProjectsForSelect();
        modal.show();
      });
      
      document.getElementById('saveEventBtn').addEventListener('click', () => handleSaveEvent(modal));
    });
  </script>
</body>
</html>
