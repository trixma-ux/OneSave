<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSave - Rapports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h1 class="h4 mb-4 text-primary fw-bold">OneSave</h1>
    <nav class="nav flex-column">
      <a href="/dashboard.html" class="nav-link"> <i class="bi bi-house-door me-2"></i> Tableau de bord</a>
      <a href="/projects.html" class="nav-link"> <i class="bi bi-folder me-2"></i> Projets</a>
      <a href="/events.html" class="nav-link"> <i class="bi bi-calendar-event me-2"></i> Événements</a>
      <a href="/reports.html" class="nav-link active"> <i class="bi bi-file-text me-2"></i> Rapports</a>
      <hr>
      <a href="#" class="nav-link" onclick="auth.logout()"><i class="bi bi-box-arrow-right me-2"></i> Déconnexion</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Rapports</h2>
        <div>
          <button class="btn btn-outline-secondary me-2" onclick="refreshPage()">Rafraîchir</button>
          <button class="btn btn-primary" id="newReportBtn">Nouveau rapport</button>
        </div>
      </div>

      <div id="reportsGrid" class="row"></div>

        <!-- Modal Rapport -->
        <div class="modal fade" id="reportModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Nouveau rapport</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Titre</label>
                  <input id="reportTitle" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Contenu</label>
                  <textarea id="reportContent" class="form-control" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Projet associé</label>
                  <select id="reportProject" class="form-control">
                    <option value="">-- Aucun projet --</option>
                  </select>
                </div>
                <input type="hidden" id="reportModalSaveMode" value="create">
                <input type="hidden" id="reportModalId" value="">
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                <button class="btn btn-primary" id="saveReportBtn">Enregistrer</button>
              </div>
            </div>
          </div>
          <!-- Global delete confirmation modal -->
          <div class="modal fade" id="globalDeleteModal" tabindex="-1">
            <div class="modal-dialog modal-sm">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title">Confirmer la suppression</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <p>Voulez-vous vraiment supprimer <strong class="delete-target-name"></strong> ?</p>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                  <button type="button" class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
                </div>
              </div>
            </div>
          </div>
        </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadReports() {
      try {
        const list = await reports.getAll();
        document.getElementById('reportsGrid').innerHTML = list.map(r => reports.renderReportCard(r)).join('');
      } catch (e) {
        showError('Impossible de récupérer les rapports');
      }
    }

    async function loadProjectsForReportSelect() {
      try {
        const projectsList = await window.projects.getAll();
        const sel = document.getElementById('reportProject');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- Aucun projet --</option>' + projectsList.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
      } catch (e) {
        showError('Impossible de charger la liste des projets');
      }
    }

    async function handleSaveReport(modal) {
      try {
        const data = {
          title: document.getElementById('reportTitle').value,
          content: document.getElementById('reportContent').value,
          project_id: document.getElementById('reportProject').value || null
        };
        const mode = document.getElementById('reportModalSaveMode').value;
        if (mode === 'edit') {
          const id = document.getElementById('reportModalId').value;
          await reports.update(id, data);
          showSuccess('Rapport mis à jour');
        } else {
          await reports.create(data);
          showSuccess('Rapport créé');
        }
        modal.hide();
        await loadReports();
      } catch (e) {
        showError('Erreur création rapport');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      loadReports();
      const modal = new bootstrap.Modal(document.getElementById('reportModal'));
      document.getElementById('newReportBtn').addEventListener('click', async () => {
        document.getElementById('reportTitle').value = '';
        document.getElementById('reportContent').value = '';
        document.getElementById('reportModalSaveMode').value = 'create';
        document.getElementById('reportModalId').value = '';
        await loadProjectsForReportSelect();
        modal.show();
      });
      document.getElementById('saveReportBtn').addEventListener('click', () => handleSaveReport(modal));
    });
  </script>
</body>
</html>
