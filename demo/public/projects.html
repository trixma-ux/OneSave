<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSave - Projets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <h1 class="h4 mb-4 text-primary fw-bold">OneSave</h1>
    <nav class="nav flex-column">
      <a href="/dashboard.html" class="nav-link"> <i class="bi bi-house-door me-2"></i> Tableau de bord</a>
      <a href="/projects.html" class="nav-link active"> <i class="bi bi-folder me-2"></i> Projets</a>
      <a href="/events.html" class="nav-link"> <i class="bi bi-calendar-event me-2"></i> Événements</a>
      <a href="/reports.html" class="nav-link"> <i class="bi bi-file-text me-2"></i> Rapports</a>
      <hr>
      <a href="#" class="nav-link" onclick="auth.logout()"><i class="bi bi-box-arrow-right me-2"></i> Déconnexion</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Projets</h2>
        <div>
          <button class="btn btn-outline-secondary me-2" onclick="refreshPage()">Rafraîchir</button>
          <button class="btn btn-primary" id="newProjectBtn">Nouveau projet</button>
        </div>
      </div>

      <div id="projectsGrid" class="row"></div>

      <!-- Modal simple pour création de projet (locale, non persistée côté API) -->
      <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Nouveau projet</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Titre</label>
                <input id="projTitle" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="projDesc" class="form-control" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Statut</label>
                <select id="projStatus" class="form-control">
                  <option value="planifié">Planifié</option>
                  <option value="en_cours">En cours</option>
                  <option value="terminé">Terminé</option>
                  <option value="annulé">Annulé</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Progression (%)</label>
                <input type="number" id="projProgress" class="form-control" min="0" max="100" value="0">
              </div>
              <input type="hidden" id="projectModalSaveMode" value="create">
              <input type="hidden" id="projectModalId" value="">
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
              <button class="btn btn-primary" id="saveProjectBtn">Enregistrer</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Global delete confirmation modal -->
  <div class="modal fade" id="globalDeleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmer la suppression</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Voulez-vous vraiment supprimer <strong class="delete-target-name"></strong> ?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadProjects() {
      try {
        const list = await projects.getAll();
        document.getElementById('projectsGrid').innerHTML = list.map(p => projects.renderProjectCard(p)).join('');
      } catch (e) {
        showError('Impossible de récupérer la liste des projets');
      }
    }

    async function handleSaveProject(modal) {
      try {
        const data = {
          title: document.getElementById('projTitle').value,
          description: document.getElementById('projDesc').value,
          status: document.getElementById('projStatus').value,
          progress: parseInt(document.getElementById('projProgress').value) || 0
        };

        const mode = document.getElementById('projectModalSaveMode').value;
        if (mode === 'edit') {
          const id = document.getElementById('projectModalId').value;
          await projects.update(id, data);
          showSuccess('Projet mis à jour');
        } else {
          await projects.create(data);
          showSuccess('Projet créé avec succès');
        }

        modal.hide();
        await loadProjects(); // Recharger la liste
      } catch (e) {
        showError('Erreur lors de la création du projet');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      loadProjects();

      const modal = new bootstrap.Modal(document.getElementById('projectModal'));
      document.getElementById('newProjectBtn').addEventListener('click', () => {
        // Réinitialiser le formulaire
        document.getElementById('projTitle').value = '';
        document.getElementById('projDesc').value = '';
        document.getElementById('projStatus').value = 'planifié';
        document.getElementById('projProgress').value = '0';
        document.getElementById('projectModalSaveMode').value = 'create';
        document.getElementById('projectModalId').value = '';
        modal.show();
      });
      
      document.getElementById('saveProjectBtn').addEventListener('click', () => handleSaveProject(modal));
    });
  </script>
</body>
</html>
