<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneSave - Tableau de bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h1 class="h4 mb-4 text-primary fw-bold">OneSave</h1>
        <nav class="nav flex-column">
            <a href="/dashboard.html" class="nav-link">
                <i class="bi bi-house-door me-2"></i> Tableau de bord
            </a>
            <a href="/projects.html" class="nav-link">
                <i class="bi bi-folder me-2"></i> Projets
            </a>
            <a href="/events.html" class="nav-link">
                <i class="bi bi-calendar-event me-2"></i> Événements
            </a>
            <a href="/reports.html" class="nav-link">
                <i class="bi bi-file-text me-2"></i> Rapports
            </a>
            <hr>
            <a href="#" class="nav-link" onclick="auth.logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Déconnexion
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <h2 class="mb-4">Tableau de bord</h2>

            <!-- Statistics -->
            <div class="row mb-4" id="statistics">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Recent Projects -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Projets récents</h5>
                            <a href="/projects.html" class="btn btn-sm btn-primary">Voir tout</a>
                        </div>
                        <div class="card-body">
                            <div id="recentProjects" class="list-group list-group-flush">
                                <!-- Will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Upcoming Events -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Événements à venir</h5>
                            <a href="/events.html" class="btn btn-sm btn-primary">Voir tout</a>
                        </div>
                        <div class="card-body">
                            <div id="upcomingEvents" class="list-group list-group-flush">
                                <!-- Will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        async function loadDashboard() {
            try {
                const stats = await projects.getStatistics();
                const recentProjects = await projects.getAll();
                const upcomingEvents = await events.getAll();

                // Afficher les statistiques
                document.getElementById('statistics').innerHTML = `
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-primary">
                            <div class="card-body">
                                <h5 class="card-title">Projets totaux</h5>
                                <p class="card-text display-6">${stats.totalProjects}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-success">
                            <div class="card-body">
                                <h5 class="card-title">Projets actifs</h5>
                                <p class="card-text display-6">${stats.activeProjects}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-warning">
                            <div class="card-body">
                                <h5 class="card-title">Événements à venir</h5>
                                <p class="card-text display-6">${stats.upcomingEvents}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card border-info">
                            <div class="card-body">
                                <h5 class="card-title">Progression moyenne</h5>
                                <p class="card-text display-6">${Math.round(stats.averageProgress)}%</p>
                            </div>
                        </div>
                    </div>
                `;

                // Afficher les projets récents
                document.getElementById('recentProjects').innerHTML = recentProjects
                    .slice(0, 5)
                    .map(project => `
                        <a href="/projects.html#${project.id}" class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1">${project.title}</h6>
                                <span class="badge bg-${getStatusColor(project.status)}">${project.status}</span>
                            </div>
                            <div class="progress" style="height: 5px;">
                                <div class="progress-bar" role="progressbar" style="width: ${project.progress}%"></div>
                            </div>
                        </a>
                    `).join('');

                // Afficher les événements à venir
                document.getElementById('upcomingEvents').innerHTML = upcomingEvents
                    .slice(0, 5)
                    .map(event => `
                        <a href="/events.html#${event.id}" class="list-group-item list-group-item-action">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1">${event.name}</h6>
                                <small>${new Date(event.date).toLocaleDateString()}</small>
                            </div>
                            <small class="text-muted">${event.description}</small>
                        </a>
                    `).join('');

            } catch (error) {
                showError('Erreur lors du chargement des données');
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            initNavigation();
            loadDashboard();
        });
    </script>
</body>
</html>
