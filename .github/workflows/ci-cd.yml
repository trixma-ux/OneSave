name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # SQLite paths are resolved relative to server/prisma/schema.prisma
  # => this points to server/prisma/test.db
  DATABASE_URL: "file:./test.db"
  JWT_SECRET: "test-secret-key-ci"
  NODE_ENV: "test"

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install server dependencies
      working-directory: ./server
      run: npm ci

    - name: Generate Prisma client
      working-directory: ./server
      run: npx prisma generate

    - name: Create test database schema
      working-directory: ./server
      run: npx prisma db push --skip-generate

    - name: Build server
      working-directory: ./server
      run: npm run build

    - name: Run server tests
      working-directory: ./server
      run: npm test

    - name: Run e2e tests
      working-directory: ./server
      run: npm run test:e2e

  # Build Frontend
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Build client
      working-directory: ./client
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/build/

  # Deploy to Railway (Backend) - skipped until RAILWAY_TOKEN is configured
  deploy-backend:
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      if: env.RAILWAY_TOKEN != ''
      with:
        fetch-depth: 0

    - name: Deploy to Railway
      if: env.RAILWAY_TOKEN != ''
      run: |
        npm i -g @railway/cli
        railway link ${{ secrets.RAILWAY_PROJECT_ID }}
        railway up --service backend
        # Run migrations on deployed database
        railway run "cd server && npx prisma migrate deploy"

    - name: Skip notice
      if: env.RAILWAY_TOKEN == ''
      run: echo "RAILWAY_TOKEN not set - backend deploy skipped."

  # Deploy to Vercel (Frontend) - skipped until VERCEL_TOKEN is configured
  deploy-frontend:
    needs: [build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      if: env.VERCEL_TOKEN != ''

    - name: Deploy to Vercel
      if: env.VERCEL_TOKEN != ''
      run: |
        npm i -g vercel
        vercel --prod --token $VERCEL_TOKEN \
          -e REACT_APP_API_URL=${{ secrets.API_URL }}

    - name: Skip notice
      if: env.VERCEL_TOKEN == ''
      run: echo "VERCEL_TOKEN not set - frontend deploy skipped."
