name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/onesave_test?schema=public"
  JWT_SECRET: "test-secret-key-ci"
  NODE_ENV: "test"

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onesave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install server dependencies
      working-directory: ./server
      run: npm ci

    - name: Generate Prisma client
      working-directory: ./server
      run: npx prisma generate

    - name: Apply database migrations
      working-directory: ./server
      run: npx prisma migrate deploy

    - name: Build server
      working-directory: ./server
      run: npm run build

    - name: Run server tests
      working-directory: ./server
      run: npm test

    - name: Run e2e tests
      working-directory: ./server
      run: npm run test:e2e

  # Build Frontend
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Build client
      working-directory: ./client
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/build/

  # Déploiements : backend sur Render (render.yaml, auto-deploy depuis main),
  # frontend sur GitHub Pages (deploy-web.yml). Jobs Railway/Vercel retirés.
